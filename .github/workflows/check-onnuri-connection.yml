name: 온누리 공개 검색 연결 진단
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 진단할 표준 실행 환경
        type: choice
        default: ubuntu-latest
        options: [ubuntu-latest, windows-latest, macos-latest, all]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'all' && '["ubuntu-latest","windows-latest","macos-latest"]' || format('["{0}"]', inputs.platform)) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 4
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: 공개 서버 DNS, TCP, HTTPS, 검색 응답 확인
        run: python scripts/check_onnuri_connection.py
