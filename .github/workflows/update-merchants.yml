name: 가맹점 분할 수집 루프
# 2026-11-04 사용자 요청: 예약 수집 중단. 명시적인 재개 요청 후에만 수동 실행한다.
on:
  workflow_dispatch:
    inputs:
      max_requests:
        description: 최대 요청 수 (시험 3회·정상 증량 후 4회; 단계별 한도는 항상 적용)
        type: choice
        default: '4'
        options: ['1', '3', '4', '0']
concurrency:
  group: gas-map-data-write
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      MAX_REQUESTS: ${{ github.event.inputs.max_requests || '4' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: merchant-collector-state
          path: .collector-state
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests 'shapely>=2.0,<3' 'pyproj>=3.6,<4'
      - name: 진행 기록 쓰기 준비
        run: |
          git -C .collector-state config user.name 'github-actions[bot]'
          git -C .collector-state config user.email 'github-actions[bot]@users.noreply.github.com'
      - name: 저장된 진도부터 소량 수집
        id: collect
        run: python scripts/incremental_collector.py --state-dir .collector-state --persist-git --max-requests "$MAX_REQUESTS"
      - name: 검증 가능한 지점만 반영
        run: |
          git fetch origin main
          git merge --ff-only origin/main
          python scripts/publish_collector_results.py --state-dir .collector-state
      - name: 데이터 회귀 검사
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: 변경 기록 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/map.html output/gas_stations.json output/merchant_status.json output/merchant_review.json output/nationwide_candidates.json output/supplemental_onnuri_evidence.json
          git diff --staged --quiet || git commit -m 'chore: 검증된 가맹점 분할 수집 결과 반영'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            python -m unittest discover -s tests -p 'test_*.py'
          done
          git push origin HEAD:main
      - name: 공개 파일 준비
        run: python scripts/prepare_site.py
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
      - name: 회차 결과 요약
        if: always()
        run: |
          if [ -f .collector-state/summary.json ]; then
            echo '## 가맹점 분할 수집 결과' >> "$GITHUB_STEP_SUMMARY"
            cat .collector-state/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '미확정·원천 부족은 완료로 처리하지 않습니다. 원천 거절 상태는 다음 회차에도 유지합니다.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merchant-loop-${{ github.run_id }}
          path: |
            .collector-state/state.json
            .collector-state/summary.json
          if-no-files-found: warn
          retention-days: 30
