name: 오피넷 가격 자동 업데이트

on:
  schedule:
    - cron: '15 0 * * *'  # KST 09:15, 기본 일일 호출 예산 내
  workflow_dispatch:       # 수동 실행 가능

concurrency:
  group: gas-map-data-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install requests python-dotenv

      - name: 가격 수집
        env:
          OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
        run: |
          python scripts/fetch_prices.py

      - name: map.html 가격 반영
        run: python scripts/sync_prices.py

      - name: 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/map.html output/gas_prices.json output/opinet_usage.json
          git diff --staged --quiet || git commit -m "chore: 오피넷 가격 자동 업데이트 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
          git push

      - name: index.html 준비
        run: python scripts/prepare_site.py

      - name: GitHub Pages 배포
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
