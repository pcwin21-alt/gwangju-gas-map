name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'output/map.html'
      - 'output/gas_stations.json'
      - 'output/gas_prices.json'
      - 'thumbnail.png'
      - 'favicon.svg'
      - 'assets/**'
      - 'scripts/prepare_site.py'

concurrency:
  group: gas-map-data-write
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Copy map.html as index.html
        run: python scripts/prepare_site.py

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
